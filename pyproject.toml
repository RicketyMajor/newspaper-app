[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newspaper"
version = "0.1.0"
description = "A personal daily newspaper: RSS sources, local AI curation, TUI and local web reader"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Alonso Vera", email = "alonsoveralarach@gmail.com" },
]

dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "textual>=1.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "rich>=13.0",
    "py-vapid>=1.9",
    "http-ece>=1.2",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
newspaper = "newspaper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/newspaper"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/newspaper/tui/*" = ["RUF012"]  # Textual declares BINDINGS as class-level lists

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
